<h2 class="doctor-list__title">Médecins</h2>

<ul class="doctor-list">
  @for (doctor of doctors(); track doctor.id) {
  <li class="doctor-card">
    <h3 class="doctor-card__name">Dr {{ doctor.firstName }} {{ doctor.lastName }}</h3>
    <p class="doctor-card__specialty">{{ doctor.specialty }}</p>
    <p class="doctor-card__address">{{ doctor.address }}, {{ doctor.city }}</p>
  </li>
  }
</ul>
